<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>States</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background: rgb(255, 255, 255);
      }
      .btn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: rgb(0, 0, 255);
        color: rgb(255, 255, 255);
        transition: background 300ms ease;
      }
      .btn .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: rgb(255, 255, 255);
      }
      .btn:hover {
        background: rgb(255, 0, 0);
      }
      .btn:hover .dot {
        background: rgb(0, 0, 0);
      }
      .btn:focus-visible {
        outline: 2px solid rgb(0, 128, 0);
        outline-offset: 2px;
      }
      .btn:active {
        opacity: 0.5;
      }
      .link {
        color: rgb(0, 0, 255);
        text-decoration: none;
      }
      @media (min-width: 1px) {
        .link:hover {
          color: rgb(128, 0, 128);
          text-decoration: underline;
        }
      }
      li:hover > a {
        color: rgb(255, 128, 0);
      }
      .nested {
        background: rgb(200, 200, 200);
        &:hover {
          background: rgb(100, 100, 100);
        }
      }
      .calm:not(:hover) {
        color: rgb(1, 2, 3);
      }
    </style>
  </head>
  <body>
    <button class="btn"><span class="dot"></span>Save</button>
    <a class="link" href="/docs">Docs</a>
    <ul>
      <li><a href="/item">Item</a></li>
    </ul>
    <div class="nested" tabindex="0">Nested</div>
    <button class="plain">Plain</button>
    <a class="calm" href="/calm">Calm</a>
  </body>
</html>
