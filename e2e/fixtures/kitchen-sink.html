<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kitchen sink</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: rgb(250, 250, 250);
        color: rgb(17, 17, 17);
      }
      header {
        display: flex;
        gap: 24px;
        align-items: center;
        justify-content: space-between;
        padding: 16px 32px;
        background: linear-gradient(90deg, rgb(255, 0, 0), rgb(0, 0, 255));
      }
      .card {
        width: 320px;
        margin: 40px;
        padding: 24px;
        border-radius: 16px;
        border: 2px solid rgb(0, 128, 0);
        box-shadow: rgba(0, 0, 0, 0.2) 0px 8px 24px -4px;
        background: white;
      }
      .badge::before {
        content: 'NEW';
        display: inline-block;
        padding: 2px 6px;
        margin-right: 8px;
        background: rgb(249, 0, 10);
        color: white;
        border-radius: 4px;
        font-size: 11px;
      }
      .gradient-text {
        background: linear-gradient(90deg, rgb(99, 100, 255), rgb(249, 0, 10));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 40px;
        font-weight: 700;
      }
      .rotated {
        width: 100px;
        height: 40px;
        background: rgb(0, 0, 0);
        transform: rotate(45deg);
        margin: 60px;
      }
      .hidden {
        display: none;
      }
      .icon {
        color: rgb(0, 128, 255);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/pricing" aria-label="Pricing">Pricing</a>
      <nav><a href="/docs">Docs</a></nav>
    </header>
    <main>
      <section class="card">
        <h1>Hello <strong>bold</strong> world</h1>
        <p class="badge">Pseudo element before this text.</p>
        <p>
          A paragraph long enough to wrap onto more than one line inside a narrow card so that the
          walker reports several lines.
        </p>
        <img
          alt="Red pixel"
          width="40"
          height="40"
          src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
        />
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="currentColor" />
        </svg>
        <input placeholder="Email address" />
      </section>
      <div class="gradient-text">Gradient headline</div>
      <div class="rotated"></div>
      <div class="hidden">Never captured</div>
    </main>
  </body>
</html>
