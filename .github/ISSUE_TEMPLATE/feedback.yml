name: Feedback
description: Tell us what works, what doesn't, and what you'd change.
title: '[Feedback] '
labels: [feedback]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Chrome extension, Figma plugin, Both, Documentation]
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PageRecast version
