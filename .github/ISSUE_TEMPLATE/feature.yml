name: Feature request
description: Suggest something PageRecast should do.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task and where PageRecast gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
